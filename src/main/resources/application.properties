server.port=8080
spring.application.name=StudyMind AI

# Thymeleaf Template Engine Configuration
spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# H2 Database Configuration (Persistent file-based storage)
spring.datasource.url=jdbc:h2:file:./data/studymind_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:}

# H2 Console Security (Strictly local, protected behind Spring Security ROLE_ADMIN)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
spring.h2.console.settings.trace=false

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# File Upload Security Limits (Max 5MB strictly enforced)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Error Handling Security (No stack trace or internal exception leakage)
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false

# Logging & Production Hardening (Turn off debug mode)
logging.level.root=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
